<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found: NSW Fuel Finder</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      Netlify serves this for any path with nothing at it. Plain HTML and one
      stylesheet, no script: it has to work even if the app's own code is the
      thing that is missing. No inline styles either, so the same
      Content-Security-Policy applies here as everywhere.
    -->
    <link rel="stylesheet" href="/404.css" />
  </head>
  <body>
    <main>
      <p class="mark" aria-hidden="true">
        <img src="/favicon.svg" alt="" width="48" height="48" />
      </p>
      <h1>Page not found</h1>
      <p>There is nothing at this address. The fuel prices are on the home page.</p>
      <p><a class="button" href="/">Search fuel prices</a></p>
    </main>
  </body>
</html>
