# Netlify build configuration.

[build]
  command = "pnpm build"
  publish = "dist"
  functions = "netlify/functions"
  # Skip the build when nothing deployable changed since the last deploy.
  # The team is on Legacy Free, where a build costs build minutes (300 a
  # month, shared by all 16 of the team's sites) rather than credits; a
  # docs-only push should spend neither. Exit 0 = skip; any change outside
  # docs/ and Markdown (or a first deploy, with nothing to diff) builds.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)docs/' ':(exclude)*.md'"

[build.environment]
  # Matches .nvmrc, so the deploy and CI use the same major.
  NODE_VERSION = "22"

  # Install exactly what the lockfile says, the same as CI. PNPM_FLAGS, not
  # NPM_FLAGS: Netlify passes the latter only to npm.
  PNPM_FLAGS = "--frozen-lockfile"

  # FUEL_API_KEY and FUEL_API_SECRET are deliberately NOT here. They are set
  # in the Netlify UI (Site configuration > Environment variables), scoped to
  # Functions, so they never reach the build or the browser bundle.

# No [functions] node_bundler setting: Netlify always bundles v2 functions
# (the Request -> Response kind used here) with NFT and ignores it. NFT copies
# the function's node_modules dependencies next to it, which is why
# `netlify dev` on Windows needs Developer Mode - see docs/decisions.md.

# Two functions. `snapshot` is scheduled (every 30 minutes; the cron is in its
# source, where Netlify reads it) and is the only code that calls API.NSW. It
# writes prices to Netlify Blobs. `api` reads them and has no public schedule.
#
# The browser only ever talks to /api/*. That path, and the function's rate
# limit, are set in the function's own `config` (netlify/functions/api/api.ts),
# not here: with a custom path it is not also served at
# /.netlify/functions/api, which a rewrite here would have left open around
# the limit. The function has a fixed set of routes (router.ts) and is not an
# open proxy.

# SECURITY HEADERS, on every response. Checked by netlify/lib/securityHeaders.test.ts
# (the inline script's hash still matches index.html) and in a real browser by
# `pnpm check:browser`, which fails on any CSP violation in the console.
#
# Content-Security-Policy, directive by directive:
#   default-src 'self'      Anything not named below: this origin only.
#   script-src              Our own bundle, plus one inline script by exact
#                           SHA-256 hash, never 'unsafe-inline' or 'unsafe-eval':
#                           index.html's first-paint theme script.
#   style-src 'self'        Our stylesheets only, no inline <style> or style="".
#                           React and MapLibre set styles through the CSSOM
#                           (element.style), which CSP does not govern.
#                           Netlify's free-plan badge, which needed both
#                           'unsafe-inline' styles and a script hash, is no
#                           longer served (checked 2026-10-24). If it comes
#                           back, this policy blocks it and check:browser
#                           fails, saying so: see docs/decisions.md, round 9.
#   img-src                 Our icons; data: and blob: for images MapLibre
#                           decodes in memory; OpenFreeMap's sprites.
#   connect-src             /api, and OpenFreeMap's style, tiles, fonts and
#                           sprites (fetched by the page and by MapLibre's worker).
#   worker-src 'self'       MapLibre's worker is our own hashed asset, loaded as a
#                           module worker from this origin (setWorkerUrl in
#                           src/features/map/mapStyle.ts). MapLibre only falls
#                           back to blob: workers for a cross-origin worker URL.
#   frame-src 'none'        The site embeds no frames.
#   frame-ancestors 'none'  Nobody may frame the site (clickjacking).
#   object-src, base-uri, form-action: the usual locks.
# Referrer-Policy: other sites (OpenFreeMap, the credited sources) get our
#   origin, never the page URL, whose query carries a search or rounded position.
# Permissions-Policy: geolocation for this origin only ("Use my location");
#   every other powerful feature off.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-8leFtmYHobOnJ2TTLagqipvI3y5hDqTTeH8jSY8hBhA='; style-src 'self'; img-src 'self' data: blob: https://tiles.openfreemap.org; font-src 'self'; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self'; frame-src 'none'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"

# Vite names every built asset after a hash of its contents, so a file at a
# given /assets/ URL never changes. Netlify's default (max-age=0,
# must-revalidate) makes a returning visitor ask about each one again; the
# map's ~1.5 MB of chunk and worker is then a round trip each before the map
# can start. index.html keeps the default, so a deploy is seen at once.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# `netlify dev` runs Vite and the function behind one origin on :8888, so the
# frontend calls /api/* in development exactly as it will in production.
[dev]
  framework = "#custom"
  # strictPort: if 5173 is taken, fail loudly rather than let Vite move to
  # 5174 while netlify dev keeps waiting on 5173.
  command = "pnpm exec vite --port 5173 --strictPort"
  targetPort = 5173
  port = 8888
