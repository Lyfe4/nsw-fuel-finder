# pnpm settings for this repo.

# Packages allowed to run install-time build scripts. pnpm blocks these by
# default (a supply-chain safeguard), so each one must be opted in explicitly.
# unrs-resolver ships the native module resolver used by eslint-plugin-import-x;
# esbuild is the bundler Vite and Netlify's function builder run on.
allowBuilds:
  esbuild: true
  unrs-resolver: true

# Install no version published less than a day ago (minutes). Most malicious
# releases are found and pulled within hours; this keeps them out of a fresh
# install or a Dependabot update until then. Raise it per package with
# minimumReleaseAgeExclude if an urgent security fix cannot wait.
minimumReleaseAge: 1440
